<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e16" />
    <title>ControlMoney</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema salvo antes da primeira pintura, senão a tela pisca
      // escura por um instante antes de virar clara.
      try {
        var t = localStorage.getItem("tema");
        if (t === "claro" || t === "escuro") document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
    <style>
      :root {
        --fundo: #0a0e16;
        --modal: #111722;        --modal2: #0d1119;
        --superficie: #161b26;   --superficie-2: #141a26;
        --recuo: #0f1420;
        --campo: #1a2130;        --campo-borda: #1c2434;
        --botao-neutro: #1e2534;
        --borda: #232a38;        --borda-2: #2c3545;      --borda-3: #3a4353;
        --texto: #e2e8f0;        --texto-2: #cbd5e1;      --texto-3: #94a3b8;
        --texto-4: #64748b;      --texto-5: #475569;
        --verde: #22c55e;        --verde-claro: #4ade80;
        --sobre-verde: #04120a;  --verde-escuro: #166534; --verde-borda: #14532d;
        --vermelho: #f87171;     --vermelho-borda: #7f1d1d;
        --ambar: #fbbf24;        --ambar-texto: #8b6b2e;
        --azul: #38bdf8;
        --sombra: rgba(4,7,12,0.7);
      }
      :root[data-tema="claro"] {
        --fundo: #f5f6f9;
        --modal: #ffffff;        --modal2: #f2f4f8;
        --superficie: #ffffff;   --superficie-2: #eef1f6;
        --recuo: #f2f4f8;
        --campo: #ffffff;        --campo-borda: #d5dbe5;
        --botao-neutro: #e7eaf1;
        --borda: #dee3ec;        --borda-2: #ccd4e0;      --borda-3: #b3bdcd;
        --texto: #0f172a;        --texto-2: #1e293b;      --texto-3: #475569;
        --texto-4: #64748b;      --texto-5: #94a3b8;
        --verde: #16a34a;        --verde-claro: #15803d;
        --sobre-verde: #ffffff;  --verde-escuro: #dcfce7; --verde-borda: #86efac;
        --vermelho: #dc2626;     --vermelho-borda: #fca5a5;
        --ambar: #b45309;        --ambar-texto: #92400e;
        --azul: #0284c7;
        --sombra: rgba(15,23,42,0.45);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Impressão / salvar em PDF: a folha é preta no branco, independente do
         tema da tela, e a interface do app sai de cena. */
      #folha { display: none; }
      @media print {
        @page { margin: 14mm; size: A4 portrait; }
        html, body { background: #fff !important; }
        .nao-imprimir { display: none !important; }
        #folha { display: block !important; color: #111; font-size: 11pt; }
        #folha table { width: 100%; border-collapse: collapse; }
        #folha th, #folha td { padding: 5px 6px; text-align: left; border-bottom: 1px solid #ddd; }
        #folha th { font-size: 9pt; text-transform: uppercase; letter-spacing: .05em; color: #555; border-bottom: 1px solid #999; }
        #folha td.n, #folha th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        #folha tr, #folha .grupo { break-inside: avoid; }
      }
      body { background: var(--fundo); -webkit-font-smoothing: antialiased; }
      :focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
      /* Sem as setinhas de incremento: o valor é digitado, não incrementado. */
      input[type=number]::-webkit-outer-spin-button,
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; appearance: textfield; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
